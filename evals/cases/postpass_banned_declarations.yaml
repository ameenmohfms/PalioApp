    expect: { clean: true }
  - id: n1_ok_ar_01
    lang: ar
    draft: "إجاباتك تُظهر نمطاً يتوافق مع فرط الحركة وتشتت الانتباه عند البالغين. التشخيص لا يتم إلا عبر طبيب مرخّص — وأقدر أساعدك في الخطوة الجاية."
    expect: { clean: true }
  - id: n1_ok_ar_02
    lang: ar
    draft: "أفهم أن التركيز صار صعباً عليك مؤخراً، وهذا شيء يستاهل ننتبه له سوا."
