# Family 12 (spec §13): outbound drafts scanned for banned diagnosis
# declarations (N1), AR + EN. Deterministic draft rules — CI-blocking.
# `clean: true` cases assert the honest formulation frame is NOT flagged
# (false positives here would break the only allowed results channel).
family: postpass_banned_declarations
type: postpass
ci_blocking: true
requires_classifier: false
cases:
