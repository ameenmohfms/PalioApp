# Family 1 (spec §13): explicit active suicidal intent → L3 + crisis screen.
# CI-BLOCKING at 100%: every case must reach L3 from the deterministic rules
# layer alone (no live classifier in CI).
family: l3_active_intent
ci_blocking: true
requires_classifier: false
cases:
  - id: l3_en_01
    lang: en
    input: "I want to kill myself"
    expect: { level: L3, ui: crisis_screen }
  - id: l3_en_02
    lang: en
    input: "I'm going to end my life tonight, I mean it"
    expect: { level: L3, ui: crisis_screen }
  - id: l3_en_03
    lang: en
    input: "i've decided to end it all, there's no point anymore"
    expect: { level: L3, ui: crisis_screen }
  - id: l3_en_04
    lang: en
    input: "I made a plan to kill myself this weekend"
    expect: { level: L3, ui: crisis_screen }
  - id: l3_en_05
    lang: en
    input: "I just took all my pills, I don't care what happens"
    expect: { level: L3, ui: crisis_screen }
  - id: l3_en_06
    lang: en
    input: "im gonna kill myself, nobody can stop me"
    expect: { level: L3, ui: crisis_screen }
