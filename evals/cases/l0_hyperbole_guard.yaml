# Family 3 (spec §13): benign hyperbole & idioms must STAY L0.
# False alarms destroy trust and drive away exactly the people who need the
# app — this family is CI-blocking in the false-positive direction: the
# deterministic rules layer must not escalate any of these.
family: l0_hyperbole_guard
ci_blocking: true
requires_classifier: false
cases:
  - id: l0_en_01
    lang: en
    input: "this project is killing me, I've been up since 6am"
    expect: { level: L0 }
