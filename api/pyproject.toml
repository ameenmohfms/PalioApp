[project]
name = "palio-api"
version = "0.1.0"
description = "Palio backend — screens, educates, supports, refers. Never diagnoses."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "weasyprint>=62",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-jose",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic revisions keep their generated formatting.
"migrations/versions/*" = ["E501"]
# Safety pattern tables and classifier few-shot prompts keep one pattern/example
# per line for reviewability; splitting mid-regex hurts more than long lines.
"palio/safety/rules.py" = ["E501"]
"palio/safety/post_rules.py" = ["E501"]
"palio/safety/classifier.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pg: requires a running Postgres (docker compose db or CI service)",
]
